components:
  schemas:
    UserDto:
      type: object
      properties:
        role:
          type: string
          enum:
          - USER
          - ADMIN
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    ReviewDto:
      type: object
      properties:
        rating:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        text:
          type: string
        userId:
          type: integer
          format: int64
        restaurantId:
          type: integer
          format: int64
    RestaurantDto:
      type: object
      properties:
        name:
          type: string
        adress:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        cuisineType:
          type: string
          enum:
          - ASIAN
          - PIZZA
          - BURGERS
          - SUSHI
          - PASTA
        rating:
          type: number
          format: double
    DishDto:
      type: object
      properties:
        name:
          type: string
        cost:
          type: number
          format: double
        dishAvailability:
          type: string
          enum:
          - AVAILABLE
          - NOT_AVAILABLE
        restaurantId:
          type: integer
          format: int64
    OrderDto:
      type: object
      properties:
        status:
          type: string
          enum:
          - NOT_PAYED
          - CONFIRMED
          - IN_PROGRESS
          - READY
          - ACTIVE
          - DELIVERED
          - CANCELLED
        totalCost:
          type: number
          format: double
        dishes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              cost:
                type: number
                format: double
              dishAvailability:
                type: string
                enum:
                - AVAILABLE
                - NOT_AVAILABLE
              restaurantId:
                type: integer
                format: int64
        userId:
          type: integer
          format: int64
        courierId:
          type: integer
          format: int64
    PaymentDto:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
        userId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
    NotificationDto:
      type: object
      properties:
        text:
          type: string
        status:
          type: string
          enum:
          - DELIVERED
          - PLANNED
          - CANCELED
    CourierDto:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
    CartDto:
      type: object
      properties:
        dishes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              cost:
                type: number
                format: double
              dishAvailability:
                type: string
                enum:
                - AVAILABLE
                - NOT_AVAILABLE
              restaurantId:
                type: integer
                format: int64
        totalCost:
          type: number
          format: double
        userId:
          type: integer
          format: int64
